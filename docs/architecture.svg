<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="system-ui,Segoe UI,sans-serif" font-size="13">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="1240" height="700" fill="#0f172a"/>
<text x="24" y="34" fill="#f1f5f9" font-size="20" font-weight="700">HA Cockpit: Kubernetes on vSphere, seen from both sides</text>
<rect x="24" y="60" width="560" height="300" rx="10" fill="#0b1220" stroke="#334155"/>
<text x="36" y="82" fill="#e2e8f0" font-weight="600">vSphere  (read-only view)</text>
<rect x="40" y="100" width="170" height="150" rx="10" fill="#172033" stroke="#334155"/>
<text x="52" y="122" fill="#e2e8f0" font-weight="600">esx001</text>
<rect x="50" y="130" width="150" height="24" rx="6" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa"/>
<text x="60" y="146" fill="#e2e8f0">etcd-1</text>
<rect x="50" y="162" width="150" height="24" rx="6" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa"/>
<text x="60" y="178" fill="#e2e8f0">manager-1</text>
<rect x="50" y="194" width="150" height="24" rx="6" fill="#94a3b8" fill-opacity=".22" stroke="#94a3b8"/>
<text x="60" y="210" fill="#e2e8f0">worker-1</text>
<rect x="220" y="100" width="170" height="150" rx="10" fill="#172033" stroke="#334155"/>
<text x="232" y="122" fill="#e2e8f0" font-weight="600">esx002</text>
<rect x="230" y="130" width="150" height="24" rx="6" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa"/>
<text x="240" y="146" fill="#e2e8f0">etcd-2</text>
<rect x="230" y="162" width="150" height="24" rx="6" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa"/>
<text x="240" y="178" fill="#e2e8f0">manager-2</text>
<rect x="230" y="194" width="150" height="24" rx="6" fill="#94a3b8" fill-opacity=".22" stroke="#94a3b8"/>
<text x="240" y="210" fill="#e2e8f0">worker-2</text>
<rect x="400" y="100" width="170" height="150" rx="10" fill="#172033" stroke="#334155"/>
<text x="412" y="122" fill="#e2e8f0" font-weight="600">esx003</text>
<rect x="410" y="130" width="150" height="24" rx="6" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa"/>
<text x="420" y="146" fill="#e2e8f0">etcd-3</text>
<rect x="410" y="162" width="150" height="24" rx="6" fill="#60a5fa" fill-opacity=".22" stroke="#60a5fa"/>
<text x="420" y="178" fill="#e2e8f0">manager-3</text>
<rect x="410" y="194" width="150" height="24" rx="6" fill="#94a3b8" fill-opacity=".22" stroke="#94a3b8"/>
<text x="420" y="210" fill="#e2e8f0">worker-3</text>
<text x="40" y="285" fill="#94a3b8">DRS / vMotion can move these VMs at any time.</text>
<text x="40" y="305" fill="#94a3b8">Kubernetes never sees which host a node is on.</text>
<text x="40" y="335" fill="#fbbf24">Two etcd VMs on one host = one host failure from losing quorum.</text>
<rect x="650" y="60" width="290" height="150" rx="10" fill="#1e293b" stroke="#22c55e"/>
<text x="662" y="82" fill="#86efac" font-weight="600">kube-hostfail</text>
<text x="662" y="102" fill="#94a3b8">maps node / etcd member to VM, host</text>
<text x="662" y="120" fill="#94a3b8">simulates every host failure</text>
<text x="662" y="138" fill="#94a3b8">checks DRS anti-affinity rules</text>
<text x="662" y="156" fill="#94a3b8">prints the fix, never applies it</text>
<line x1="584" y1="150" x2="650" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="592" y="140" fill="#94a3b8" font-size="11">vCenter</text><text x="596" y="172" fill="#94a3b8" font-size="11">read-only</text>
<rect x="650" y="230" width="290" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
<text x="662" y="252" fill="#e2e8f0" font-weight="600">Kubernetes API (read-only)</text>
<text x="662" y="272" fill="#94a3b8">nodes, pods, PDBs, VIP lease</text>
<line x1="795" y1="230" x2="795" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="990" y="60" width="226" height="150" rx="10" fill="#1e293b" stroke="#f97316"/>
<text x="1002" y="82" fill="#fdba74" font-weight="600">Prometheus + Grafana</text>
<text x="1002" y="102" fill="#94a3b8">hostfail_* metrics + alerts</text>
<text x="1002" y="120" fill="#94a3b8">verdict-per-host dashboard</text>
<text x="1002" y="138" fill="#94a3b8">kubeadm-safe scrape config</text>
<line x1="940" y1="135" x2="990" y2="135" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="944" y="125" fill="#94a3b8" font-size="11">/metrics</text>
<rect x="650" y="330" width="566" height="130" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="662" y="352" fill="#7dd3fc" font-weight="600">Istio service mesh</text>
<text x="662" y="372" fill="#94a3b8">demo shop: frontend, catalog, pricing v1/v2</text>
<text x="662" y="390" fill="#94a3b8">Envoy sidecars to Prometheus (metrics)  and  Jaeger (traces)</text>
<text x="662" y="408" fill="#94a3b8">Kiali draws the live request graph</text>
<rect x="670" y="420" width="90" height="24" rx="6" fill="#38bdf8" fill-opacity=".22" stroke="#38bdf8"/>
<text x="680" y="436" fill="#e2e8f0">Kiali</text>
<rect x="770" y="420" width="90" height="24" rx="6" fill="#38bdf8" fill-opacity=".22" stroke="#38bdf8"/>
<text x="780" y="436" fill="#e2e8f0">Jaeger</text>
<rect x="870" y="420" width="110" height="24" rx="6" fill="#38bdf8" fill-opacity=".22" stroke="#38bdf8"/>
<text x="880" y="436" fill="#e2e8f0">Demo shop</text>
<line x1="1103" y1="330" x2="1103" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="24" y="490" width="1192" height="190" rx="10" fill="#0b1220" stroke="#6366f1"/>
<text x="36" y="512" fill="#a5b4fc" font-weight="600">One Gateway (Gateway API), path-routed, one port</text>
<rect x="44" y="526" width="150" height="24" rx="6" fill="#6366f1" fill-opacity=".22" stroke="#6366f1"/>
<text x="54" y="542" fill="#e2e8f0">/  Launcher</text>
<rect x="210" y="526" width="150" height="24" rx="6" fill="#6366f1" fill-opacity=".22" stroke="#6366f1"/>
<text x="220" y="542" fill="#e2e8f0">/hostfail</text>
<rect x="376" y="526" width="150" height="24" rx="6" fill="#6366f1" fill-opacity=".22" stroke="#6366f1"/>
<text x="386" y="542" fill="#e2e8f0">/grafana</text>
<rect x="542" y="526" width="150" height="24" rx="6" fill="#6366f1" fill-opacity=".22" stroke="#6366f1"/>
<text x="552" y="542" fill="#e2e8f0">/prometheus</text>
<rect x="708" y="526" width="150" height="24" rx="6" fill="#6366f1" fill-opacity=".22" stroke="#6366f1"/>
<text x="718" y="542" fill="#e2e8f0">/kiali</text>
<rect x="874" y="526" width="150" height="24" rx="6" fill="#6366f1" fill-opacity=".22" stroke="#6366f1"/>
<text x="884" y="542" fill="#e2e8f0">/jaeger</text>
<rect x="1040" y="526" width="150" height="24" rx="6" fill="#6366f1" fill-opacity=".22" stroke="#6366f1"/>
<text x="1050" y="542" fill="#e2e8f0">/shop</text>
<text x="44" y="586" fill="#94a3b8">Launcher builds its tiles from the HTTPRoutes in the cluster: publish an app, a tile appears. Each tile has a live health dot.</text>
<text x="44" y="608" fill="#94a3b8">Reached over MetalLB, NodePort, or kubectl port-forward through the bastion.</text>
<text x="44" y="648" fill="#64748b">Nothing here writes to vCenter. Sidecars are injected only into the demo namespace.</text>
</svg>