name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck
        run: |
          set -e
          for f in scripts/*.sh; do bash -n "$f"; done
          sudo apt-get install -y -q shellcheck
          shellcheck -S warning -e SC2089,SC2090 scripts/*.sh
      - name: Python syntax (launcher, demo shop, dashboard generator)
        run: python3 -m py_compile launcher/app.py demo-shop/shop.py scripts/gen_dashboard.py docs/gen_diagram.py
      - name: Generated files are up to date
        run: |
          python3 scripts/gen_dashboard.py | diff - deploy/observability/hostfail-dashboard.yaml
          python3 docs/gen_diagram.py && git diff --exit-code docs/architecture.svg

  hostfail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - name: Build vcsim + govc (vCenter simulator)
        run: |
          git clone --depth 1 https://github.com/vmware/govmomi.git /tmp/govmomi
          (cd /tmp/govmomi/vcsim && go build -o /usr/local/bin/vcsim .)
          (cd /tmp/govmomi/govc && go build -o /usr/local/bin/govc .)
      - name: Unit + end-to-end tests (end-to-end runs against vcsim)
        working-directory: kube-hostfail
        run: |
          pip install -e '.[test]'
          pytest -v

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install helm + kubeconform
        run: |
          curl -sSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz | tar xz && sudo mv linux-amd64/helm /usr/local/bin/
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz && sudo mv kubeconform /usr/local/bin/
      - name: Render charts and project manifests, validate against schemas
        run: |
          set -e
          . scripts/lib.sh
          mkdir -p /tmp/r
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add istio https://istio-release.storage.googleapis.com/charts
          helm repo add kiali https://kiali.org/helm-charts
          helm repo update
          helm template kps prometheus-community/kube-prometheus-stack --version $KPS_VERSION -n $NS_OBS -f deploy/observability/kps-values.yaml > /tmp/r/kps.yaml
          helm template kps prometheus-community/kube-prometheus-stack --version $KPS_VERSION -n $NS_OBS -f deploy/observability/kps-values.yaml -f deploy/observability/kps-values-etcd.yaml --set kubeEtcd.endpoints[0]=10.0.0.1 > /tmp/r/kps-etcd.yaml
          helm template istiod istio/istiod --version $ISTIO_VERSION -n $NS_ISTIO -f deploy/observability/istiod-values.yaml > /tmp/r/istiod.yaml
          helm template kiali kiali/kiali-server --version $KIALI_VERSION -n $NS_ISTIO -f deploy/observability/kiali-values.yaml > /tmp/r/kiali.yaml
          route_vars
          for f in gateway launcher demo-shop hostfail; do render < deploy/$f.yaml > /tmp/r/$f.yaml; done
          render < deploy/observability/istio-monitors.yaml > /tmp/r/istio-monitors.yaml
          cp deploy/observability/{jaeger,telemetry,hostfail-rules,hostfail-dashboard}.yaml /tmp/r/
          kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.33.0 -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' /tmp/r/*.yaml

  image:
    needs: [hostfail]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Lowercase owner (image names must be lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: kube-hostfail
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/kube-hostfail:0.1.0
            ghcr.io/${{ env.OWNER }}/kube-hostfail:latest
