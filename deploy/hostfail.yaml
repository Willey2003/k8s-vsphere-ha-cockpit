apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-hostfail
  namespace: ${NS_SYS}
---
# read-only: list/get only, no secrets, no writes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-hostfail-read
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-hostfail-read
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-hostfail-read}
subjects:
  - {kind: ServiceAccount, name: kube-hostfail, namespace: ${NS_SYS}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-hostfail-vip-lease
  namespace: kube-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [plndr-cp-lock]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-hostfail-vip-lease
  namespace: kube-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: kube-hostfail-vip-lease}
subjects:
  - {kind: ServiceAccount, name: kube-hostfail, namespace: ${NS_SYS}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-hostfail
  namespace: ${NS_SYS}
  labels: {app: kube-hostfail}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-hostfail}}
  template:
    metadata:
      labels: {app: kube-hostfail}
    spec:
      serviceAccountName: kube-hostfail
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hostfail
          image: ${HOSTFAIL_IMAGE}
          args: [serve, --port, "9877", --interval, "60"]
          env:
            - {name: HOSTFAIL_CLUSTER_NAME, value: "${HOSTFAIL_CLUSTER_NAME}"}
            - {name: HOSTFAIL_DEPTH, value: "${HOSTFAIL_DEPTH}"}
            - {name: HOSTFAIL_EXCLUDE_NAMESPACES, value: "kube-system"}
${HOSTFAIL_ENV}
${HOSTFAIL_ENVFROM}
          ports: [{name: http, containerPort: 9877}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
${HOSTFAIL_VOLUME_MOUNTS}
${HOSTFAIL_VOLUMES}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-hostfail
  namespace: ${NS_SYS}
  labels: {app: kube-hostfail}
spec:
  selector: {app: kube-hostfail}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-hostfail
  namespace: ${NS_SYS}
  labels: {app: kube-hostfail}
spec:
  selector: {matchLabels: {app: kube-hostfail}}
  endpoints: [{port: http, path: /metrics, interval: 30s}]
