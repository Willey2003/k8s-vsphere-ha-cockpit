apiVersion: v1
kind: Namespace
metadata:
  name: ${NS_DEMO}
  labels:
    istio-injection: enabled
    app.kubernetes.io/part-of: ha-cockpit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ${NS_DEMO}
  labels: {app: frontend, version: v1}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend, version: v1}}
  template:
    metadata:
      labels: {app: frontend, version: v1}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: frontend}}
      containers:
        - name: frontend
          image: python:3.12-alpine
          command: [python, -u, /app/shop.py]
          env:
            - {name: ROLE, value: "frontend"}
            - {name: VERSION, value: "v1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: code, mountPath: /app, readOnly: true}]
      volumes:
        - name: code
          configMap: {name: shop-code}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ${NS_DEMO}
  labels: {app: frontend}
spec:
  selector: {app: frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: ${NS_DEMO}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: frontend}}
---
apiVersion: apps/v1
