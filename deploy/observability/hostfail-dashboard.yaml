apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-hostfail-dashboard
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ha-cockpit
data:
  kube-hostfail.json: |
    {
      "uid": "kube-hostfail",
      "title": "kube-hostfail \u00b7 ESXi host failure impact",
      "schemaVersion": 39,
      "version": 1,
      "tags": [
        "kube-hostfail",
        "vsphere",
        "ha"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "ESXi hosts that are a single point of failure",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "hostfail_single_points_of_failure",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "etcd members discovered",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "hostfail_etcd_members",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unmapped nodes / etcd members",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "hostfail_unmapped_objects",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Last scan",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "hostfail_last_scan_success",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "FAILING"
                    },
                    "1": {
                      "text": "OK"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "If this ESXi host fails: verdict (0 safe \u2026 3 cluster down)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "hostfail_host_failure_verdict",
              "refId": "A",
              "instant": true,
              "legendFormat": "{{esxi_host}} \u00b7 {{verdict}}"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 3,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "SAFE",
                      "color": "green"
                    },
                    "1": {
                      "text": "DEGRADED",
                      "color": "yellow"
                    },
                    "2": {
                      "text": "APP OUTAGE",
                      "color": "orange"
                    },
                    "3": {
                      "text": "CLUSTER DOWN",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "etcd members still alive if this host fails",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "hostfail_host_failure_etcd_members_alive",
              "refId": "A",
              "instant": true,
              "legendFormat": "{{esxi_host}}"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "basic",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 3,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Where etcd lives",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "hostfail_etcd_member_placement",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "Value": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "container": true
                },
                "renameByName": {
                  "member": "etcd member",
                  "vm": "VM",
                  "esxi_host": "ESXi host"
                }
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Where nodes live",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 12,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "expr": "hostfail_node_placement",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "Value": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "container": true
                },
                "renameByName": {
                  "node": "node",
                  "vm": "VM",
                  "esxi_host": "ESXi host",
                  "role": "role"
                }
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "DRS anti-affinity coverage (1 = problem)",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "expr": "hostfail_drs_antiaffinity_missing",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "Value": true,
                  "job": true,
                  "instance": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "container": true
                },
                "renameByName": {
                  "group": "group",
                  "status": "status"
                }
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Workloads losing every replica, per failed host",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 20,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "expr": "hostfail_host_failure_workloads_down",
              "refId": "A",
              "legendFormat": "{{esxi_host}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
